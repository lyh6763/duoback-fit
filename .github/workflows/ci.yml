name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # npm install (not ci): the lockfile is generated on Windows and npm ci's
      # strict check can fail on Linux over platform-specific optional deps
      # (SWC, lightningcss, Tailwind oxide native binaries).
      - run: npm install

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # E2E runs against the production build from the previous step
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: "1"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
