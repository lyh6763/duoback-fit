name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # npm install (not ci): the lockfile is generated on Windows and npm ci's
      # strict check can fail on Linux over platform-specific optional deps
      # (SWC, lightningcss, Tailwind oxide native binaries).
      - run: npm install

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # 화면용 폰트 서브셋에 빌드 결과물의 글자가 모두 들어 있는지
      - run: npm run fonts:web -- --check

      # E2E runs against the production build from the previous step
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: "1"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # 성능 회귀 감시. 이 PC가 아닌 GitHub 러너에서 재서 측정 환경을 일정하게 유지한다.
  # verify와 병렬로 돌고, 결과 표는 실행 요약(Summary)에, 리포트는 아티팩트에 남긴다.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run lighthouse

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          retention-days: 14
