name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm install (not ci): the lockfile is generated on Windows and npm ci's
      # strict check can fail on Linux over platform-specific optional deps
      # (SWC, lightningcss, Tailwind oxide native binaries).
      - run: npm install

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
